name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and Build Tools
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Install Rust & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Cargo & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-rust-android-${{ hashFiles('**/Cargo.lock', '**/*.gradle*') }}

      - name: Build APK
        run: |
          # Inspect tools/build or apps/notes if this repo uses a custom build script (e.g., cargo xtask, just, or gradle)
          if [ -f "apps/notes/gradlew" ]; then
            cd apps/notes && chmod +x gradlew && ./gradlew assembleDebug
          elif [ -f "gradlew" ]; then
            chmod +x gradlew && ./gradlew assembleDebug
          else
            # Fallback if built via a Rust build tool in tools/build (adjust command as needed per README.md)
            cargo build --release --target aarch64-linux-android
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: heartnet-notes-apk
          path: "**/*.apk"
          if-no-files-found: error
          
